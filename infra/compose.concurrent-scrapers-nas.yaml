  recovery-worker-nas-morizon:
    <<: *artifact-recovery-worker
    command:
      - python
      - -m
      - homefinder.artifact_recovery_worker
      - --source
      - morizon
      - --worker-id
      - recovery-worker-nas-morizon-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
      - ${HOMEZ_SCRAPE_COORDINATOR_URL:?set private tailnet coordinator URL}
      - --token-file
      - /run/secrets/recovery_worker_nas_morizon
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --dependency-lock-file
      - /app/release/requirements.lock
    secrets:
      - recovery_worker_nas_morizon

  recovery-worker-nas-otodom:
    <<: *artifact-recovery-worker
    command:
      - python
      - -m
      - homefinder.artifact_recovery_worker
      - --source
      - otodom
      - --worker-id
      - recovery-worker-nas-otodom-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
      - ${HOMEZ_SCRAPE_COORDINATOR_URL:?set private tailnet coordinator URL}
      - --token-file
      - /run/secrets/recovery_worker_nas_otodom
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --heartbeat-file
