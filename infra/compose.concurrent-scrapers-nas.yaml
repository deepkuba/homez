      - --dependency-lock-file
      - /app/release/requirements.lock
    secrets:
      - recovery_worker_nas_otodom

  recovery-worker-nas-olx:
    <<: *artifact-recovery-worker
    command:
      - python
      - -m
      - homefinder.artifact_recovery_worker
      - --source
      - olx
      - --worker-id
      - recovery-worker-nas-olx-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
