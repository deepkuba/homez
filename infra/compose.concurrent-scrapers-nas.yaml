      - /tmp/scrape-heartbeat
      - --dependency-lock-file
      - /app/release/requirements.lock
      - --proxy-pool-file
      - /run/secrets/scrape_proxy_pool
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --artifact-token-file
      - /run/secrets/artifact_worker_nas_olx
    secrets:
      - scrape_worker_nas_olx
      - artifact_worker_nas_olx
      - scrape_proxy_pool

  recovery-worker-nas-gratka:
    <<: *artifact-recovery-worker
    command:
      - python
      - -m
      - homefinder.artifact_recovery_worker
      - --source
      - gratka
      - --worker-id
      - recovery-worker-nas-gratka-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
      - ${HOMEZ_SCRAPE_COORDINATOR_URL:?set private tailnet coordinator URL}
      - --token-file
      - /run/secrets/recovery_worker_nas_gratka
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --dependency-lock-file
      - /app/release/requirements.lock
    secrets:
