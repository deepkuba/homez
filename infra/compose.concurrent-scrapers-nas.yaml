---
# Required-variable expressions and immutable worker IDs must remain unbroken.
# yamllint disable rule:line-length
# Opt-in topology; source pacing and release deployment gates remain closed.
x-concurrent-worker: &concurrent-worker
  image: >-
    ${HOMEZ_IMAGE:?set image}@${HOMEZ_SCRAPE_IMAGE_DIGEST:?set immutable digest}
  profiles:
    - concurrent-scrapers
  user: 10001:10001
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 30s
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.5
  healthcheck:
    test:
      - CMD
      - homefinder
      - runtime-health
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --max-age-seconds
      - '90'
    interval: 30s
    timeout: 15s
    start_period: 10s
    retries: 3
  networks:
    - concurrent-scraper-egress

x-artifact-recovery-worker: &artifact-recovery-worker
  <<: *concurrent-worker
  pids_limit: 64
  mem_limit: 128m
  cpus: 0.25

services:
  scrape-worker-nas-gratka:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - gratka
      - --deployment
      - nas
      - --worker-id
      - scrape-worker-nas-gratka-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
      - ${HOMEZ_SCRAPE_COORDINATOR_URL:?set private tailnet coordinator URL}
      - --token-file
      - /run/secrets/scrape_worker_nas_gratka
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --dependency-lock-file
      - /app/release/requirements.lock
      - --proxy-pool-file
      - /run/secrets/scrape_proxy_pool
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --artifact-token-file
      - /run/secrets/artifact_worker_nas_gratka
    secrets:
      - scrape_worker_nas_gratka
      - artifact_worker_nas_gratka
      - scrape_proxy_pool

  scrape-worker-nas-morizon:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - morizon
      - --deployment
      - nas
      - --worker-id
      - scrape-worker-nas-morizon-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
      - ${HOMEZ_SCRAPE_COORDINATOR_URL:?set private tailnet coordinator URL}
      - --token-file
      - /run/secrets/scrape_worker_nas_morizon
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --dependency-lock-file
      - /app/release/requirements.lock
      - --proxy-pool-file
      - /run/secrets/scrape_proxy_pool
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --artifact-token-file
      - /run/secrets/artifact_worker_nas_morizon
    secrets:
      - scrape_worker_nas_morizon
      - artifact_worker_nas_morizon
      - scrape_proxy_pool

  scrape-worker-nas-otodom:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - otodom
      - --deployment
      - nas
      - --worker-id
      - scrape-worker-nas-otodom-${HOMEZ_SCRAPE_WORKER_SLOT:?set immutable release slot}
      - --coordinator-url
      - ${HOMEZ_SCRAPE_COORDINATOR_URL:?set private tailnet coordinator URL}
      - --token-file
      - /run/secrets/scrape_worker_nas_otodom
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --dependency-lock-file
      - /app/release/requirements.lock
      - --proxy-pool-file
      - /run/secrets/scrape_proxy_pool
      - --artifact-url
      - ${HOMEZ_ARTIFACT_ENDPOINT:?set private NAS artifact endpoint}
      - --artifact-token-file
      - /run/secrets/artifact_worker_nas_otodom
    secrets:
      - scrape_worker_nas_otodom
      - artifact_worker_nas_otodom
      - scrape_proxy_pool

  scrape-worker-nas-olx:
    <<: *concurrent-worker
