# Opt-in topology; source pacing and release deployment gates remain closed.
x-concurrent-worker: &concurrent-worker
  image: >-
    ${HOMEZ_IMAGE:?set image}@${HOMEZ_SCRAPE_IMAGE_DIGEST:?set immutable digest}
  profiles:
    - concurrent-scrapers
  user: 10001:10001
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 30s
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.5
  healthcheck:
    test:
      - CMD
      - homefinder
      - runtime-health
      - --heartbeat-file
      - /tmp/scrape-heartbeat
      - --max-age-seconds
      - '90'
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3
  networks:
    - concurrent-scraper-control
    - concurrent-scraper-egress

services:
  web:
    networks:
      - backend
      - frontend
      - concurrent-scraper-control

  scrape-worker-vps-gratka:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - gratka
      - --deployment
      - vps
      - --worker-id
      - scrape-worker-vps-gratka
      - --coordinator-url
      - http://web:8000
      - --token-file
      - /run/secrets/scrape_worker_vps_gratka
      - --heartbeat-file
      - /tmp/scrape-heartbeat
    secrets:
      - scrape_worker_vps_gratka

  scrape-worker-vps-morizon:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - morizon
      - --deployment
      - vps
      - --worker-id
      - scrape-worker-vps-morizon
      - --coordinator-url
      - http://web:8000
      - --token-file
      - /run/secrets/scrape_worker_vps_morizon
      - --heartbeat-file
      - /tmp/scrape-heartbeat
    secrets:
      - scrape_worker_vps_morizon

  scrape-worker-vps-otodom:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - otodom
      - --deployment
      - vps
      - --worker-id
      - scrape-worker-vps-otodom
      - --coordinator-url
      - http://web:8000
      - --token-file
      - /run/secrets/scrape_worker_vps_otodom
      - --heartbeat-file
      - /tmp/scrape-heartbeat
    secrets:
      - scrape_worker_vps_otodom

  scrape-worker-vps-olx:
    <<: *concurrent-worker
    command:
      - python
      - -m
      - homefinder.scraper.worker
      - --source
      - olx
      - --deployment
      - vps
      - --worker-id
      - scrape-worker-vps-olx
      - --coordinator-url
      - http://web:8000
      - --token-file
      - /run/secrets/scrape_worker_vps_olx
      - --heartbeat-file
      - /tmp/scrape-heartbeat
    secrets:
      - scrape_worker_vps_olx

networks:
  concurrent-scraper-control:
    internal: true
  concurrent-scraper-egress:
    driver: bridge
secrets:
  scrape_worker_vps_gratka:
    file: ${HOMEZ_SECRETS_DIR:?set secrets dir}/scrape-worker-vps-gratka-token
  scrape_worker_vps_morizon:
    file: ${HOMEZ_SECRETS_DIR:?set secrets dir}/scrape-worker-vps-morizon-token
  scrape_worker_vps_otodom:
    file: ${HOMEZ_SECRETS_DIR:?set secrets dir}/scrape-worker-vps-otodom-token
  scrape_worker_vps_olx:
    file: ${HOMEZ_SECRETS_DIR:?set secrets dir}/scrape-worker-vps-olx-token
