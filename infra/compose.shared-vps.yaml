services:
  ingress:
    profiles:
      - standalone-ingress

  web:
    command:
      - uvicorn
      - homefinder.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "${HOMEZ_TRUSTED_PROXY_IP:?set HOMEZ_TRUSTED_PROXY_IP}"
    ports:
      - "127.0.0.1:18000:8000"

networks:
  frontend:
    ipam:
      config:
        - subnet: "${HOMEZ_FRONTEND_SUBNET:?set HOMEZ_FRONTEND_SUBNET}"
          gateway: "${HOMEZ_TRUSTED_PROXY_IP:?set HOMEZ_TRUSTED_PROXY_IP}"
