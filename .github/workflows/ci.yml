name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: homefinder_test
          POSTGRES_USER: homefinder
          POSTGRES_PASSWORD: fake-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homefinder -d homefinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: >-
        postgresql+psycopg://homefinder:fake-ci-password@localhost:5432/homefinder_test
      TEST_POSTGRES_URL: >-
        postgresql+psycopg://homefinder:fake-ci-password@localhost:5432/homefinder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: >-
          python -m pip install --disable-pip-version-check
          --constraint requirements.lock -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: >-
          pip-audit --requirement requirements.lock --no-deps --disable-pip
      - run: yamllint -d relaxed .github/workflows .github/dependabot.yml
      - run: alembic upgrade head
      - run: alembic check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: homefinder:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Compose migrations and health
        run: |
          export HOMEZ_IMAGE=homefinder
          export HOMEZ_IMAGE_TAG=test
          export HOMEFINDER_ENVIRONMENT=production
          export POSTGRES_PASSWORD=fake-compose-password
          compose() {
            docker compose --project-name homez-ci -f infra/compose.yaml "$@"
          }
          cleanup() {
            compose down --volumes --remove-orphans
          }
          trap cleanup EXIT
          compose up --detach db
          compose run --rm app alembic upgrade head
          compose up --detach --wait
          compose exec -T db psql --username homefinder \
            --dbname homefinder --command 'SELECT PostGIS_Version();'
          catalog_table=$(compose exec -T db psql --username homefinder \
            --dbname homefinder --tuples-only --no-align \
            --command "SELECT to_regclass('public.source_messages');")
          test "$catalog_table" = source_messages
          compose ps
