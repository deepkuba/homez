name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: >-
          python -m pip install --disable-pip-version-check
          --constraint requirements.lock -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: >-
          pip-audit --requirement requirements.lock --no-deps --disable-pip
      - run: yamllint -d relaxed .github/workflows .github/dependabot.yml
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///migration-check.sqlite3

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: homefinder:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container health
        run: |
          docker run --detach --name homefinder-smoke \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 1s --health-start-period 1s \
            --health-timeout 3s --health-retries 3 \
            homefinder:test
          trap 'docker rm --force homefinder-smoke' EXIT
          for attempt in $(seq 1 20); do
            status=$(docker inspect \
              --format '{{.State.Health.Status}}' homefinder-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then
              docker logs homefinder-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs homefinder-smoke
          exit 1
