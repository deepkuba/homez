[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "homefinder"
version = "0.1.0"
description = "Private, explainable home-finding assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic==1.19.1",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "jinja2==3.1.6",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "yamllint==1.38.0",
]

[project.scripts]
homefinder = "homefinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homefinder"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["postgres: requires a live PostgreSQL/PostGIS database"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["homefinder"]
